<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VITALX Devices</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="stylesheet" href="assets/css/devices.css">
</head>
<body>
<!-- صفحة الأجهزة: الهيكل فقط. النصوص من assets/js/content.js (devicesPage) -->
<header class="topbar">
  <div class="wrap topbar-in">
    <a class="brand" href="index.html">VITAL<span>X</span></a>
    <nav id="nav"><a href="index.html" id="backLink"></a></nav>
    <button id="langBtn" class="lang-btn" type="button"></button>
  </div>
</header>

<main>
  <section class="dv-hero">
    <div class="stars" aria-hidden="true"></div>
    <div class="wrap">
      <p class="kicker" id="dvKicker"></p>
      <h1 id="dvTitle"></h1>
      <p class="lede" id="dvIntro"></p>
      <div class="player">
        <button class="btn primary" id="playBtn" type="button"></button>
        <button class="btn" id="restartBtn" type="button"></button>
        <label class="speed"><span id="speedLab"></span>
          <input type="range" id="speed" min="1" max="8" step="1" value="3"></label>
        <span class="daybadge"><span id="dayLab"></span> <b id="dayNum" dir="ltr">0</b></span>
        <span class="tag-synth" id="synthTag"></span>
      </div>
    </div>
  </section>

  <section class="sec stage-sec"><div class="wrap stage">
    <!-- الساعة -->
    <article class="device-card">
      <div class="watch-stage">
        <div class="watch" id="watch">
          <div class="strap top"></div>
          <div class="case">
            <div class="crown"></div><div class="side-btn"></div>
            <div class="screen" id="screen">
              <div class="scr-top"><span class="scr-day" id="sDay" dir="ltr"></span><span class="scr-pill" id="sPill"></span></div>
              <div class="view" data-view="vitals" id="vVitals">
                <div class="ring-wrap">
                  <svg viewBox="0 0 120 120" class="ring"><circle cx="60" cy="60" r="52" class="ring-bg"/><circle cx="60" cy="60" r="52" class="ring-fg" id="ringFg"/></svg>
                  <div class="hr"><span class="heart" id="heart">♥</span><b id="sHr" dir="ltr">--</b><small>bpm</small><span class="hr-base" id="sHrBase" dir="auto"></span></div>
                </div>
                <div class="mini">
                  <div><span id="lSleep"></span><b id="sSleep">--</b></div>
                  <div><span>CO2</span><b id="sCo2">--</b></div>
                  <div><span id="lDose"></span><b id="sDose">--</b></div>
                </div>
              </div>
              <div class="view" data-view="explain" id="vExplain"></div>
              <div class="view" data-view="trend" id="vTrend">
                <canvas id="trendCv"></canvas>
                <div class="trend-txt" id="trendTxt"></div>
              </div>
              <div class="scr-dots" id="dots"></div>
            </div>
          </div>
          <div class="strap bottom"></div>
          <div class="watch-glow" id="watchGlow"></div>
        </div>
      </div>
      <div class="device-info">
        <h2 id="wTitle"></h2>
        <p id="wText"></p>
        <div class="tabs" id="tabs"></div>
      </div>
    </article>

    <!-- الشريحة -->
    <article class="device-card">
      <div class="patch-stage" id="patchStage">
        <div class="patch3d" id="patch3d"></div>
        <ol class="layer-labels" id="layerLabels"></ol>
      </div>
      <div class="device-info">
        <h2 id="pTitle"></h2>
        <p id="pText"></p>
        <button class="btn" id="explodeBtn" type="button"></button>
        <div class="ecg"><canvas id="ecgCv"></canvas></div>
      </div>
    </article>
  </div></section>

  <section class="sec alt"><div class="wrap">
    <h2 id="flowTitle"></h2>
    <div class="flow" id="flow"></div>
    <div class="others" id="others"></div>
  </div></section>
</main>

<footer class="foot"><div class="wrap"><p id="footDisclaimer"></p></div></footer>

<script src="assets/js/content.js"></script>
<script src="assets/js/engine.js"></script>
<script src="assets/js/devices.js"></script>
</body>
</html>
